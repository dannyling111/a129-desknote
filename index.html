<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeskNote 机构库 · 产量统计</title>
  <meta name="description" content="140 家机构过去一年发了多少篇、多少是干货。可排序筛选的产量大表。" />
  <meta name="theme-color" content="#0c0d0e" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0d0e;
      --surface: #151618;
      --surface-2: #1c1d20;
      --fg: #f1efe8;
      --muted: #8f8e88;
      --subtle: #6b6a66;
      --border: #2a2b2e;
      --accent: #d8dbe2;
      --good: #8fad90;
      --bad: #c98982;
      --warn: #c4b08a;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }
    button {
      font: inherit;
      cursor: pointer;
      color: inherit;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
    }
    button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    button.ghost { border-color: transparent; color: var(--muted); }
    button.ghost.on { background: var(--surface-2); color: var(--fg); }
    header {
      position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(12px);
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 16px 20px 64px; }
    .brand { font-family: Newsreader, Georgia, serif; font-size: 20px; }
    .kicker { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--subtle); }
    h1 { font-family: Newsreader, Georgia, serif; font-size: 40px; font-weight: 500; letter-spacing: -0.03em; margin: 8px 0 0; }
    .lead { max-width: 40rem; color: var(--muted); font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 24px 0; }
    .stat { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 16px; }
    .stat b { display: block; font-family: "IBM Plex Mono", monospace; font-size: 22px; font-weight: 500; }
    .stat span { color: var(--subtle); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    input[type=search] {
      width: 100%; max-width: 320px; height: 40px;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); color: var(--fg); padding: 0 12px; font: inherit;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--subtle); font-weight: 500; padding: 8px 12px; background: var(--surface-2); }
    td { padding: 12px; border-top: 1px solid var(--border); vertical-align: top; }
    tr { cursor: pointer; }
    tr:hover td { background: var(--surface); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 16px; }
    .badge {
      display: inline-flex; align-items: center; white-space: nowrap;
      border: 1px solid var(--border); border-radius: 2px;
      padding: 1px 6px; font-size: 10px; letter-spacing: 0.06em; color: var(--muted);
    }
    .badge.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
    .badge.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
    .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
    .badge.accent { color: var(--fg); background: color-mix(in srgb, var(--accent) 10%, transparent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
    .muted { color: var(--muted); } .subtle { color: var(--subtle); } .mono { font-family: "IBM Plex Mono", monospace; }
    .detail h1 { font-size: 36px; }
    .block { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 16px; margin: 12px 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .empty { padding: 32px; color: var(--muted); }
    .nav a { font-size: 13px; color: var(--muted); margin-left: 14px; }
    .nav a.on { color: var(--fg); }
    .spark { display: flex; align-items: flex-end; gap: 1px; height: 32px; }
    .spark i { display: block; width: 6px; background: var(--accent); border-radius: 2px; opacity: 0.85; }
    .barrow { display: grid; grid-template-columns: 88px 1fr 64px; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
    .hbar { height: 10px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
    .hbar > span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
    .monthgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .monthcell { border: 1px solid var(--border); border-radius: 10px; padding: 8px; background: var(--bg); }
    th button { border: 0; padding: 0; color: inherit; letter-spacing: inherit; text-transform: inherit; font-size: inherit; }
    .stack { display: flex; height: 120px; align-items: flex-end; gap: 6px; }
    .stack .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
    .stack .seg { width: 100%; }
    .legend { display: flex; gap: 12px; font-size: 11px; color: var(--subtle); margin-top: 8px; }
    .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
    @media (max-width: 720px) {
      h1 { font-size: 32px; }
      .stats { grid-template-columns: 1fr 1fr; }
      .hide-sm { display: none; }
      .two { grid-template-columns: 1fr !important; }
      .monthgrid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap" style="padding-bottom:12px;padding-top:12px;display:flex;align-items:baseline;gap:12px">
      <a class="brand" href="#/">DeskNote</a>
      <nav class="nav">
        <a href="#/" id="nav-org">机构库</a>
        <a href="#/stats" id="nav-stats">产量统计</a>
      </nav>
      <span style="margin-left:auto;font-size:12px" class="subtle">A129 · dannyling111</span>
    </div>
  </header>
  <main class="wrap" id="app"></main>
  <script src="./data.js"></script>
  <script>
    const D = window.DESKNOTE;
    const $ = (sel, el=document) => el.querySelector(sel);
    const ESC = { "&": "&" + "amp;", "<": "&" + "lt;", ">": "&" + "gt;", '"': "&" + "quot;", "'": "&#39;" };
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ESC[c]);
    const tone = (r) => r === "full" ? "good" : r === "none" ? "bad" : "warn";
    const sourceTone = (s) => s === "public_count" ? "good" : s === "public_calibrated" ? "accent" : s === "verified_none" ? "bad" : "warn";
    const orgBy = Object.fromEntries(D.orgs.map(o => [o.id, o]));
    const pubBy = Object.fromEntries((D.pubRows || []).map(r => [r.orgId, r]));

    function route() {
      const h = (location.hash || "#/").replace(/^#/, "");
      if (h === "/stats" || h.startsWith("/stats?")) return { page: "stats" };
      const m = h.match(/^\/?org\/([^/?]+)/);
      if (m) return { page: "org", id: decodeURIComponent(m[1]) };
      return { page: "list" };
    }

    function render() {
      const r = route();
      document.querySelectorAll(".nav a").forEach(a => a.classList.remove("on"));
      const nav = document.getElementById(r.page === "stats" ? "nav-stats" : "nav-org");
      if (nav) nav.classList.add("on");
      if (r.page === "org") renderDetail(r.id);
      else if (r.page === "stats") renderStats();
      else renderList();
    }

    function spark(values) {
      const max = Math.max(1, ...values);
      return `<span class="spark">${values.map(v => `<i style="height:${Math.max(8, Math.round(v / max * 100))}%"></i>`).join("")}</span>`;
    }

    function renderStats() {
      const params = new URLSearchParams((location.hash.split("?")[1] || ""));
      const family = params.get("f") || "all";
      const source = params.get("s") || "all";
      const q = params.get("q") || "";
      const sort = params.get("sort") || "substance";
      const dir = params.get("dir") || "desc";
      const hideZero = params.get("z") !== "0";
      const open = params.get("open") || "";
      let rows = (D.pubRows || []).filter(r => {
        const o = orgBy[r.orgId]; if (!o) return false;
        if (family !== "all" && o.family !== family) return false;
        if (hideZero && r.total <= 0) return false;
        if (source === "counted" && r.source !== "public_count" && r.source !== "public_calibrated") return false;
        if (source !== "all" && source !== "counted" && r.source !== source) return false;
        if (q) {
          const blob = [o.name, o.nameZh, o.short, ...(r.keywords||[]), r.sourceNote].join(" ").toLowerCase();
          if (!blob.includes(q.toLowerCase())) return false;
        }
        return true;
      });
      const mul = dir === "asc" ? 1 : -1;
      rows.sort((a, b) => {
        if (sort === "name") return orgBy[a.orgId].nameZh.localeCompare(orgBy[b.orgId].nameZh, "zh") * mul;
        return ((a[sort] || 0) - (b[sort] || 0)) * mul;
      });
      const P = D.pubs;
      const W = D.window;
      const maxMonth = Math.max(1, ...P.monthly.map(m => m.sellside + m.buyside + m.official + m.university));
      const top = [...rows].sort((a,b) => b.substance - a.substance).slice(0, 12);
      const topMax = Math.max(1, ...top.map(r => r.substance));
      const topics = (P.topicRollup || []).slice(0, 10);
      const topicMax = Math.max(1, ...topics.map(t => t.articles));
      const openRow = rows.find(r => r.orgId === open);
      const go = (patch) => {
        const p = new URLSearchParams(params);
        Object.entries(patch).forEach(([k,v]) => { if (v == null || v === "") p.delete(k); else p.set(k, v); });
        location.hash = "#/stats?" + p.toString();
      };
      $("#app").innerHTML = `
        <p class="kicker">Output ledger</p>
        <h1>产量统计</h1>
        <p class="lead">过去一年各家发了多少篇、其中多少是真正有干货的研究报告。卖方客户 note 不公开，标了估算；NBER 是点过目录的。</p>
        <div class="stats">
          <div class="stat"><span>12 个月标题件</span><b>${P.total.toLocaleString("zh-CN")}</b></div>
          <div class="stat"><span>其中干货</span><b>${P.substance.toLocaleString("zh-CN")}</b></div>
          <div class="stat"><span>有产量</span><b>${P.withOutput} / ${D.orgs.length}</b></div>
          <div class="stat"><span>干货占比</span><b>${P.substancePct}%</b></div>
        </div>
        <div class="block">
          <p class="kicker">口径</p>
          ${(D.methodology||[]).map(p => `<p class="muted" style="font-size:14px;margin:8px 0 0">${esc(p)}</p>`).join("")}
        </div>
        <h2 style="font-family:Newsreader,Georgia,serif;font-weight:500;margin-top:40px">过去一年 · 按月</h2>
        <div class="stack">
          ${P.monthly.map(m => {
            const t = m.sellside + m.buyside + m.official + m.university;
            const h = Math.max(8, Math.round(t / maxMonth * 120));
            const segs = [
              ["var(--accent)", m.sellside],
              ["var(--muted)", m.buyside],
              ["var(--good)", m.official],
              ["var(--warn)", m.university],
            ];
            return `<div class="col" title="${m.label} ${t}">
              ${segs.map(([c,v]) => `<div class="seg" style="height:${Math.round(v/maxMonth*120)}px;background:${c}"></div>`).join("")}
              <div class="subtle" style="font-size:10px;text-align:center;margin-top:4px">${m.label.replace("月","")}</div>
            </div>`;
          }).join("")}
        </div>
        <div class="legend">
          <span><i class="sw" style="background:var(--accent)"></i>卖方</span>
          <span><i class="sw" style="background:var(--muted)"></i>买方</span>
          <span><i class="sw" style="background:var(--good)"></i>官方</span>
          <span><i class="sw" style="background:var(--warn)"></i>大学</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:40px" class="two">
          <div>
            <h2 style="font-family:Newsreader,Georgia,serif;font-weight:500">干货前十二</h2>
            ${top.map(r => `<div class="barrow"><span>${esc(orgBy[r.orgId].nameZh)}</span><div class="hbar"><span style="width:${Math.round(r.substance/topMax*100)}%"></span></div><b class="mono">${r.substance.toLocaleString("zh-CN")}</b></div>`).join("")}
          </div>
          <div>
            <h2 style="font-family:Newsreader,Georgia,serif;font-weight:500">主题分布</h2>
            ${topics.map(t => `<div class="barrow"><span>${esc(t.label)}</span><div class="hbar"><span style="width:${Math.round(t.articles/topicMax*100)}%;background:var(--good)"></span></div><b class="mono">${t.articles.toLocaleString("zh-CN")}</b></div>`).join("")}
          </div>
        </div>
        <h2 style="font-family:Newsreader,Georgia,serif;font-weight:500;margin-top:40px">大表</h2>
        <p class="muted" style="font-size:14px">点表头排序。点一行看月度。</p>
        <input id="q" type="search" placeholder="搜机构、主题、口径" value="${esc(q)}" />
        <div class="toolbar" id="fam">
          ${[["all","全部分类"],["sellside","卖方投行"],["buyside","买方资管"],["official","官方专业"],["university","大学研究"]].map(([k,l]) =>
            `<button data-f="${k}" class="${family===k?"on":""}">${l}</button>`).join("")}
        </div>
        <div class="toolbar" id="src">
          ${[["all","口径不限"],["counted","只看公开数"],["estimated","模型估算"],["verified_none","已核验为零"]].map(([k,l]) =>
            `<button class="ghost ${source===k?"on":""}" data-s="${k}">${l}</button>`).join("")}
          <button class="ghost ${hideZero?"on":""}" data-z="toggle">${hideZero?"只看有产量":"含零产量"}</button>
        </div>
        <p class="subtle" style="font-size:12px">${rows.length} 家</p>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th><button data-sort="name">机构</button></th>
              <th>分类</th>
              <th><button data-sort="total">12个月</button></th>
              <th><button data-sort="substance">干货</button></th>
              <th><button data-sort="substancePct">干货%</button></th>
              <th class="hide-sm">月度</th>
              <th>口径</th>
              <th class="hide-sm">主题</th>
            </tr></thead>
            <tbody>
              ${rows.map(r => {
                const o = orgBy[r.orgId];
                return `<tr data-id="${esc(r.orgId)}" class="${open===r.orgId?"on":""}">
                  <td><div>${esc(o.nameZh)}</div><div class="subtle" style="font-size:12px">${esc(o.short)}</div></td>
                  <td><span class="badge">${esc(D.meta.FAMILY_ZH[o.family])}</span></td>
                  <td class="mono">${r.total.toLocaleString("zh-CN")}</td>
                  <td class="mono">${r.substance.toLocaleString("zh-CN")}</td>
                  <td class="mono">${r.total ? r.substancePct + "%" : "—"}</td>
                  <td class="hide-sm">${spark(r.months)}</td>
                  <td><span class="badge ${sourceTone(r.source)}">${esc(D.meta.SOURCE_ZH[r.source])}</span></td>
                  <td class="hide-sm subtle">${esc((r.keywords||[]).slice(0,3).join(" · ") || "—")}</td>
                </tr>`;
              }).join("") || `<tr><td colspan="8" class="empty">没有匹配的机构。</td></tr>`}
            </tbody>
          </table>
        </div>
        ${openRow ? `
          <div class="block" style="margin-top:20px">
            <p class="kicker">月度拆开</p>
            <h2 style="font-family:Newsreader,Georgia,serif;font-weight:500;margin:8px 0">${esc(orgBy[openRow.orgId].nameZh)}</h2>
            <p class="muted">${esc(openRow.sourceNote)}</p>
            <div class="monthgrid" style="margin-top:12px">
              ${W.labels.map((label,i) => `<div class="monthcell"><div class="subtle" style="font-size:11px">${W.yearTags[i]}/${label.replace("月","")}</div><div class="mono">${openRow.months[i]}</div><div class="subtle" style="font-size:11px;color:var(--good)">干货 ${openRow.substanceMonths[i]}</div></div>`).join("")}
            </div>
            <p class="chips" style="margin-top:12px">${(openRow.topics||[]).map(t => `<span class="badge accent">${esc(t.label)} ${t.share}%</span>`).join(" ")}</p>
            <p style="margin-top:12px"><a href="#/org/${esc(openRow.orgId)}">机构档案 →</a></p>
          </div>` : `<p class="subtle" style="font-size:12px;margin-top:12px">点表里的一行，月度会在下面展开。</p>`}
      `;
      $("#q").addEventListener("change", (e) => go({ q: e.target.value }));
      $("#q").addEventListener("keydown", (e) => { if (e.key === "Enter") go({ q: e.target.value }); });
      $("#fam").addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return; go({ f: b.dataset.f });
      });
      $("#src").addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        if (b.dataset.z) go({ z: hideZero ? "0" : "1" });
        else go({ s: b.dataset.s });
      });
      $("#app").querySelectorAll("th button[data-sort]").forEach(b => {
        b.addEventListener("click", () => {
          const k = b.dataset.sort;
          go({ sort: k, dir: sort === k && dir === "desc" ? "asc" : "desc" });
        });
      });
      $("#app").querySelectorAll("tr[data-id]").forEach(tr => {
        tr.addEventListener("click", () => go({ open: tr.dataset.id }));
      });
    }

    function renderList() {
      const params = new URLSearchParams((location.hash.split("?")[1] || ""));
      const family = params.get("f") || "sellside";
      const research = params.get("r") || "all";
      const q = params.get("q") || "";
      const stats = D.stats;
      const rows = D.orgs.filter(o => {
        if (family !== "all" && o.family !== family) return false;
        if (research !== "all" && o.research !== research) return false;
        if (q) {
          const blob = [o.name, o.nameZh, o.short, o.hq, o.check, o.why, ...(o.products||[]), ...(o.aliases||[])].join(" ").toLowerCase();
          if (!blob.includes(q.toLowerCase())) return false;
        }
        return true;
      });
      $("#app").innerHTML = `
        <p class="kicker">Atlas</p>
        <h1>机构库</h1>
        <p class="lead">席位是谁在转，这里是谁在写。先按顶尖投行研究部逐家核验：有完整 note 机器的留下，顾问投行没有研报也登记，避免以后混进雷达。</p>
        <div class="stats">
          <div class="stat"><span>卖方研究部</span><b>${stats.sellFull} / ${stats.byFamily.sellside}</b></div>
          <div class="stat"><span>买方会分享</span><b>${stats.buyShare}</b></div>
          <div class="stat"><span>官方专业</span><b>${stats.byFamily.official}</b></div>
          <div class="stat"><span>大学金融</span><b>${stats.byFamily.university}</b></div>
        </div>
        <a href="#/stats" class="block" style="display:block">
          <p class="kicker">产量台账</p>
          <p>过去一年 ${(D.pubs.total).toLocaleString("zh-CN")} 篇标题件，其中干货 ${D.pubs.substance.toLocaleString("zh-CN")} 篇。打开可排序大表 →</p>
        </a>
        <input id="q" type="search" placeholder="搜机构、产品、别名" value="${esc(q)}" />
        <div class="toolbar" id="fam">
          ${[["all","全部分类"],["sellside","卖方投行"],["buyside","买方资管"],["official","官方专业"],["university","大学研究"]].map(([k,l]) =>
            `<button data-f="${k}" class="${family===k?"on":""}">${l}</button>`).join("")}
        </div>
        <div class="toolbar" id="res">
          ${[["all","研究部不限"],["full","完整研究部"],["limited","有限公开"],["none","无研报"]].map(([k,l]) =>
            `<button class="ghost ${research===k?"on":""}" data-r="${k}">${l}</button>`).join("")}
        </div>
        <p class="subtle" style="font-size:12px">${rows.length} / ${D.orgs.length} 家</p>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>机构</th><th>分类</th><th>研究部</th>
              <th class="hide-sm">入口</th><th class="hide-sm">电讯</th><th class="hide-sm">旗舰</th>
            </tr></thead>
            <tbody>
              ${rows.map(o => `
                <tr data-id="${esc(o.id)}">
                  <td><div>${esc(o.nameZh)}</div><div class="subtle" style="font-size:12px">${esc(o.short)} · ${esc(o.hq)}</div></td>
                  <td><span class="badge">${esc(D.meta.FAMILY_ZH[o.family])}</span><div class="subtle" style="font-size:11px;margin-top:4px">${esc(D.meta.TIER_ZH[o.tier])}</div></td>
                  <td><span class="badge ${tone(o.research)}">${esc(D.meta.RESEARCH_ZH[o.research])}</span></td>
                  <td class="hide-sm subtle">${esc(D.meta.ACCESS_ZH[o.access])}</td>
                  <td class="hide-sm subtle">${esc(D.meta.LEAK_ZH[o.leak])}</td>
                  <td class="hide-sm subtle">${esc((o.products||[])[0] || "—")}</td>
                </tr>`).join("") || `<tr><td colspan="6" class="empty">没有匹配的机构。</td></tr>`}
            </tbody>
          </table>
        </div>
      `;
      $("#q").addEventListener("input", (e) => {
        const p = new URLSearchParams();
        if (family !== "sellside") p.set("f", family); else p.set("f", family);
        p.set("f", family);
        if (research !== "all") p.set("r", research);
        if (e.target.value) p.set("q", e.target.value);
        history.replaceState(null, "", "#/?" + p.toString());
        renderList();
        $("#q").focus();
        const v = $("#q").value; $("#q").setSelectionRange(v.length, v.length);
      });
      $("#fam").addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        goList(b.dataset.f, research, q);
      });
      $("#res").addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        goList(family, b.dataset.r, q);
      });
      $("#app").querySelectorAll("tr[data-id]").forEach(tr => {
        tr.addEventListener("click", () => { location.hash = "#/org/" + tr.dataset.id; });
      });
    }

    function goList(f, r, q) {
      const p = new URLSearchParams();
      p.set("f", f);
      if (r && r !== "all") p.set("r", r);
      if (q) p.set("q", q);
      location.hash = "#/?" + p.toString();
    }

    function renderDetail(id) {
      const o = D.orgs.find(x => x.id === id);
      if (!o) { $("#app").innerHTML = `<p class="lead">没有这家机构。</p><p><a href="#/">返回机构库</a></p>`; return; }
      const desks = D.desks.filter(d => (d.banks||[]).some(b =>
        [o.name, o.nameZh, o.short, ...(o.aliases||[])].some(a => a.toLowerCase() === String(b).toLowerCase())
      ));
      const pub = pubBy[o.id];
      const W = D.window || { labels: [], yearTags: [] };
      $("#app").innerHTML = `
        <div class="detail">
          <p><a class="subtle" href="#/?f=${o.family}">← 机构库</a></p>
          <p class="kicker">${esc(D.meta.FAMILY_ZH[o.family])} · ${esc(D.meta.TIER_ZH[o.tier])}</p>
          <h1>${esc(o.nameZh)}</h1>
          <p class="muted">${esc(o.name)} · ${esc(o.short)} · ${esc(o.hq)} · ${esc(D.meta.REGION_ZH[o.region] || o.region)}</p>
          <p class="chips" style="margin-top:12px">
            <span class="badge ${tone(o.research)}">${esc(D.meta.RESEARCH_ZH[o.research])}</span>
            <span class="badge">${esc(D.meta.ACCESS_ZH[o.access])}</span>
            <span class="badge">${esc(D.meta.LEAK_ZH[o.leak])}</span>
          </p>
          <div class="block"><p class="kicker">核验</p><p>${esc(o.check)}</p></div>
          <div class="block"><p class="kicker">为什么进库</p><p class="muted">${esc(o.why)}</p></div>
          ${pub ? `
            <div class="block">
              <p class="kicker">过去一年产量</p>
              <p style="display:flex;gap:24px;margin:12px 0 0">
                <span>标题件 <b class="mono">${pub.total.toLocaleString("zh-CN")}</b></span>
                <span>干货 <b class="mono">${pub.substance.toLocaleString("zh-CN")}</b></span>
                <span>干货% <b class="mono">${pub.total ? pub.substancePct + "%" : "—"}</b></span>
              </p>
              <p style="margin-top:8px"><span class="badge ${sourceTone(pub.source)}">${esc(D.meta.SOURCE_ZH[pub.source])}</span> <span class="muted" style="font-size:13px">${esc(pub.sourceNote)}</span></p>
              <p style="margin-top:12px">${spark(pub.months)}</p>
              <p class="chips" style="margin-top:12px">${(pub.keywords||[]).map(k => `<span class="badge">${esc(k)}</span>`).join(" ")}</p>
              <p style="margin-top:12px"><a href="#/stats?open=${esc(o.id)}">在产量大表里打开</a></p>
            </div>` : ""}
          <div class="block">
            <p class="kicker">旗舰产品</p>
            <p class="chips">${(o.products||[]).map(p => `<span class="badge accent">${esc(p)}</span>`).join(" ") || "—"}</p>
            <p class="kicker" style="margin-top:16px">覆盖</p>
            <p class="chips">${(o.coverage||[]).map(c => `<span class="badge">${esc(D.meta.COVERAGE_ZH[c] || c)}</span>`).join(" ")}</p>
          </div>
          <p style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
            ${o.portal ? `<a href="${esc(o.portal)}" target="_blank" rel="noreferrer"><button class="on">研究入口</button></a>` : ""}
            ${(o.handles||[]).map(h => `<a href="https://x.com/${esc(h)}" target="_blank" rel="noreferrer"><button>@${esc(h)}</button></a>`).join("")}
          </p>
          <h2 style="font-family:Newsreader,Georgia,serif;font-weight:500;margin-top:40px">转这篇的席位</h2>
          ${desks.length ? desks.map(d => `<div class="block"><b>${esc(d.nameZh)}</b> <span class="subtle">@${esc(d.handle)}</span><p class="muted" style="margin:6px 0 0;font-size:14px">${esc(d.why)}</p></div>`).join("") : `<p class="muted">这 50 席里还没有稳定转它的账号——原厂公开节奏慢，或本来就不走电讯。</p>`}
        </div>
      `;
    }

    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
