<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeskNote 机构库</title>
  <meta name="description" content="140 家卖方研究部、买方观点、官方与大学。逐家核验有没有研报。" />
  <meta name="theme-color" content="#0c0d0e" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0d0e;
      --surface: #151618;
      --surface-2: #1c1d20;
      --fg: #f1efe8;
      --muted: #8f8e88;
      --subtle: #6b6a66;
      --border: #2a2b2e;
      --accent: #d8dbe2;
      --good: #8fad90;
      --bad: #c98982;
      --warn: #c4b08a;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }
    button {
      font: inherit;
      cursor: pointer;
      color: inherit;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
    }
    button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    button.ghost { border-color: transparent; color: var(--muted); }
    button.ghost.on { background: var(--surface-2); color: var(--fg); }
    header {
      position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(12px);
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 16px 20px 64px; }
    .brand { font-family: Newsreader, Georgia, serif; font-size: 20px; }
    .kicker { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--subtle); }
    h1 { font-family: Newsreader, Georgia, serif; font-size: 40px; font-weight: 500; letter-spacing: -0.03em; margin: 8px 0 0; }
    .lead { max-width: 40rem; color: var(--muted); font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 24px 0; }
    .stat { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 16px; }
    .stat b { display: block; font-family: "IBM Plex Mono", monospace; font-size: 22px; font-weight: 500; }
    .stat span { color: var(--subtle); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    input[type=search] {
      width: 100%; max-width: 320px; height: 40px;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); color: var(--fg); padding: 0 12px; font: inherit;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--subtle); font-weight: 500; padding: 8px 12px; background: var(--surface-2); }
    td { padding: 12px; border-top: 1px solid var(--border); vertical-align: top; }
    tr { cursor: pointer; }
    tr:hover td { background: var(--surface); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 16px; }
    .badge {
      display: inline-flex; align-items: center; white-space: nowrap;
      border: 1px solid var(--border); border-radius: 2px;
      padding: 1px 6px; font-size: 10px; letter-spacing: 0.06em; color: var(--muted);
    }
    .badge.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
    .badge.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
    .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
    .badge.accent { color: var(--fg); background: color-mix(in srgb, var(--accent) 10%, transparent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
    .muted { color: var(--muted); } .subtle { color: var(--subtle); } .mono { font-family: "IBM Plex Mono", monospace; }
    .detail h1 { font-size: 36px; }
    .block { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 16px; margin: 12px 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .empty { padding: 32px; color: var(--muted); }
    @media (max-width: 720px) {
      h1 { font-size: 32px; }
      .stats { grid-template-columns: 1fr 1fr; }
      .hide-sm { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap" style="padding-bottom:12px;padding-top:12px;display:flex;align-items:baseline;gap:12px">
      <a class="brand" href="#/">DeskNote</a>
      <span class="subtle" style="font-size:11px;letter-spacing:.22em;text-transform:uppercase">机构库</span>
      <span style="margin-left:auto;font-size:12px" class="subtle">A129 · dannyling111</span>
    </div>
  </header>
  <main class="wrap" id="app"></main>
  <script src="./data.js"></script>
  <script>
    const D = window.DESKNOTE;
    const $ = (sel, el=document) => el.querySelector(sel);
    const ESC = { "&": "&" + "amp;", "<": "&" + "lt;", ">": "&" + "gt;", '"': "&" + "quot;", "'": "&#39;" };
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ESC[c]);
    const tone = (r) => r === "full" ? "good" : r === "none" ? "bad" : "warn";

    function route() {
      const h = (location.hash || "#/").replace(/^#/, "");
      const m = h.match(/^\/?org\/([^/?]+)/);
      if (m) return { page: "org", id: decodeURIComponent(m[1]) };
      return { page: "list" };
    }

    function render() {
      const r = route();
      if (r.page === "org") renderDetail(r.id);
      else renderList();
    }

    function renderList() {
      const params = new URLSearchParams((location.hash.split("?")[1] || ""));
      const family = params.get("f") || "sellside";
      const research = params.get("r") || "all";
      const q = params.get("q") || "";
      const stats = D.stats;
      const rows = D.orgs.filter(o => {
        if (family !== "all" && o.family !== family) return false;
        if (research !== "all" && o.research !== research) return false;
        if (q) {
          const blob = [o.name, o.nameZh, o.short, o.hq, o.check, o.why, ...(o.products||[]), ...(o.aliases||[])].join(" ").toLowerCase();
          if (!blob.includes(q.toLowerCase())) return false;
        }
        return true;
      });
      $("#app").innerHTML = `
        <p class="kicker">Atlas</p>
        <h1>机构库</h1>
        <p class="lead">席位是谁在转，这里是谁在写。先按顶尖投行研究部逐家核验：有完整 note 机器的留下，顾问投行没有研报也登记，避免以后混进雷达。</p>
        <div class="stats">
          <div class="stat"><span>卖方研究部</span><b>${stats.sellFull} / ${stats.byFamily.sellside}</b></div>
          <div class="stat"><span>买方会分享</span><b>${stats.buyShare}</b></div>
          <div class="stat"><span>官方专业</span><b>${stats.byFamily.official}</b></div>
          <div class="stat"><span>大学金融</span><b>${stats.byFamily.university}</b></div>
        </div>
        <input id="q" type="search" placeholder="搜机构、产品、别名" value="${esc(q)}" />
        <div class="toolbar" id="fam">
          ${[["all","全部分类"],["sellside","卖方投行"],["buyside","买方资管"],["official","官方专业"],["university","大学研究"]].map(([k,l]) =>
            `<button data-f="${k}" class="${family===k?"on":""}">${l}</button>`).join("")}
        </div>
        <div class="toolbar" id="res">
          ${[["all","研究部不限"],["full","完整研究部"],["limited","有限公开"],["none","无研报"]].map(([k,l]) =>
            `<button class="ghost ${research===k?"on":""}" data-r="${k}">${l}</button>`).join("")}
        </div>
        <p class="subtle" style="font-size:12px">${rows.length} / ${D.orgs.length} 家</p>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>机构</th><th>分类</th><th>研究部</th>
              <th class="hide-sm">入口</th><th class="hide-sm">电讯</th><th class="hide-sm">旗舰</th>
            </tr></thead>
            <tbody>
              ${rows.map(o => `
                <tr data-id="${esc(o.id)}">
                  <td><div>${esc(o.nameZh)}</div><div class="subtle" style="font-size:12px">${esc(o.short)} · ${esc(o.hq)}</div></td>
                  <td><span class="badge">${esc(D.meta.FAMILY_ZH[o.family])}</span><div class="subtle" style="font-size:11px;margin-top:4px">${esc(D.meta.TIER_ZH[o.tier])}</div></td>
                  <td><span class="badge ${tone(o.research)}">${esc(D.meta.RESEARCH_ZH[o.research])}</span></td>
                  <td class="hide-sm subtle">${esc(D.meta.ACCESS_ZH[o.access])}</td>
                  <td class="hide-sm subtle">${esc(D.meta.LEAK_ZH[o.leak])}</td>
                  <td class="hide-sm subtle">${esc((o.products||[])[0] || "—")}</td>
                </tr>`).join("") || `<tr><td colspan="6" class="empty">没有匹配的机构。</td></tr>`}
            </tbody>
          </table>
        </div>
      `;
      $("#q").addEventListener("input", (e) => {
        const p = new URLSearchParams();
        if (family !== "sellside") p.set("f", family); else p.set("f", family);
        p.set("f", family);
        if (research !== "all") p.set("r", research);
        if (e.target.value) p.set("q", e.target.value);
        history.replaceState(null, "", "#/?" + p.toString());
        renderList();
        $("#q").focus();
        const v = $("#q").value; $("#q").setSelectionRange(v.length, v.length);
      });
      $("#fam").addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        goList(b.dataset.f, research, q);
      });
      $("#res").addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        goList(family, b.dataset.r, q);
      });
      $("#app").querySelectorAll("tr[data-id]").forEach(tr => {
        tr.addEventListener("click", () => { location.hash = "#/org/" + tr.dataset.id; });
      });
    }

    function goList(f, r, q) {
      const p = new URLSearchParams();
      p.set("f", f);
      if (r && r !== "all") p.set("r", r);
      if (q) p.set("q", q);
      location.hash = "#/?" + p.toString();
    }

    function renderDetail(id) {
      const o = D.orgs.find(x => x.id === id);
      if (!o) { $("#app").innerHTML = `<p class="lead">没有这家机构。</p><p><a href="#/">返回机构库</a></p>`; return; }
      const desks = D.desks.filter(d => (d.banks||[]).some(b =>
        [o.name, o.nameZh, o.short, ...(o.aliases||[])].some(a => a.toLowerCase() === String(b).toLowerCase())
      ));
      $("#app").innerHTML = `
        <div class="detail">
          <p><a class="subtle" href="#/?f=${o.family}">← 机构库</a></p>
          <p class="kicker">${esc(D.meta.FAMILY_ZH[o.family])} · ${esc(D.meta.TIER_ZH[o.tier])}</p>
          <h1>${esc(o.nameZh)}</h1>
          <p class="muted">${esc(o.name)} · ${esc(o.short)} · ${esc(o.hq)} · ${esc(D.meta.REGION_ZH[o.region] || o.region)}</p>
          <p class="chips" style="margin-top:12px">
            <span class="badge ${tone(o.research)}">${esc(D.meta.RESEARCH_ZH[o.research])}</span>
            <span class="badge">${esc(D.meta.ACCESS_ZH[o.access])}</span>
            <span class="badge">${esc(D.meta.LEAK_ZH[o.leak])}</span>
          </p>
          <div class="block"><p class="kicker">核验</p><p>${esc(o.check)}</p></div>
          <div class="block"><p class="kicker">为什么进库</p><p class="muted">${esc(o.why)}</p></div>
          <div class="block">
            <p class="kicker">旗舰产品</p>
            <p class="chips">${(o.products||[]).map(p => `<span class="badge accent">${esc(p)}</span>`).join(" ") || "—"}</p>
            <p class="kicker" style="margin-top:16px">覆盖</p>
            <p class="chips">${(o.coverage||[]).map(c => `<span class="badge">${esc(D.meta.COVERAGE_ZH[c] || c)}</span>`).join(" ")}</p>
          </div>
          <p style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
            ${o.portal ? `<a href="${esc(o.portal)}" target="_blank" rel="noreferrer"><button class="on">研究入口</button></a>` : ""}
            ${(o.handles||[]).map(h => `<a href="https://x.com/${esc(h)}" target="_blank" rel="noreferrer"><button>@${esc(h)}</button></a>`).join("")}
          </p>
          <h2 style="font-family:Newsreader,Georgia,serif;font-weight:500;margin-top:40px">转这篇的席位</h2>
          ${desks.length ? desks.map(d => `<div class="block"><b>${esc(d.nameZh)}</b> <span class="subtle">@${esc(d.handle)}</span><p class="muted" style="margin:6px 0 0;font-size:14px">${esc(d.why)}</p></div>`).join("") : `<p class="muted">这 50 席里还没有稳定转它的账号——原厂公开节奏慢，或本来就不走电讯。</p>`}
        </div>
      `;
    }

    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
